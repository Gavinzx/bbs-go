services:
  bbs-go:
    image: bbs-go:centos7-sqlite
    restart: unless-stopped
    ports:
      - "${BBSGO_WEB_PORT:-8082}:8082"
    volumes:
      - ./docker-data/data:/app/data
      - ./docker-data/logs:/app/logs
      - ./docker-data/uploads:/app/res/uploads
    environment:
      BBSGO_ENV: prod
      BBSGO_INSTALL_DOCKER_BUILTIN_MYSQL: "false"
      TZ: Asia/Shanghai
